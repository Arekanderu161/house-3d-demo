<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Интерактивная 3D-демонстрация проекта дома с разборкой по конструктивным слоям."
    />
    <title>3D разработка дома</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/three.module.js",
          "three/addons/": "./vendor/three/addons/"
        }
      }
    </script>
  </head>
  <body>
    <main class="app-shell">
      <section class="stage drawing-mode" aria-label="3D модель дома">
        <canvas id="house-canvas"></canvas>
        <svg class="drawing-overlay" viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <pattern id="minor-grid" width="20" height="20" patternUnits="userSpaceOnUse">
              <path d="M 20 0 L 0 0 0 20" />
            </pattern>
            <pattern id="major-grid" width="100" height="100" patternUnits="userSpaceOnUse">
              <rect width="100" height="100" fill="url(#minor-grid)" />
              <path d="M 100 0 L 0 0 0 100" />
            </pattern>
            <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
              <path d="M 0 0 L 8 4 L 0 8 z" />
            </marker>
          </defs>
          <rect width="1000" height="1000" fill="url(#major-grid)" />
          <g class="dimension-lines">
            <path d="M 214 822 L 786 822" />
            <path d="M 214 792 L 214 852" />
            <path d="M 786 792 L 786 852" />
            <path d="M 832 265 L 832 716" />
            <path d="M 802 265 L 862 265" />
            <path d="M 802 716 L 862 716" />
            <path d="M 255 208 L 745 208" />
            <path d="M 255 178 L 255 238" />
            <path d="M 745 178 L 745 238" />
          </g>
          <g class="axis-lines">
            <path d="M 160 500 L 840 500" />
            <path d="M 500 170 L 500 830" />
          </g>
          <g class="drawing-labels">
            <text x="500" y="805">6.80 м</text>
            <text x="850" y="500" transform="rotate(-90 850 500)">4.85 м</text>
            <text x="500" y="191">фасад А-Г</text>
            <text x="174" y="493">ОСЬ 1</text>
            <text x="510" y="183">ОСЬ Б</text>
          </g>
        </svg>

        <header class="topbar">
          <div>
            <p class="eyebrow">АР / КР / КЖ</p>
            <h1>Дом в чертежах</h1>
          </div>
          <div class="topbar-actions" aria-label="Режимы просмотра">
            <button class="icon-button" id="fit-view" type="button" title="Показать целиком" aria-label="Показать целиком">
              ⛶
            </button>
            <button class="icon-button" id="toggle-auto" type="button" title="Автооблет" aria-label="Автооблет">
              ◌
            </button>
          </div>
        </header>

        <aside class="control-panel" aria-label="Параметры модели">
          <div class="panel-section">
            <div class="section-head">
              <span>Слои</span>
              <button id="show-all" type="button">Все</button>
            </div>
            <div class="layer-grid" id="layer-controls"></div>
          </div>

          <div class="panel-section">
            <label class="range-label" for="explode-range">
              <span>Разборка</span>
              <output id="explode-output" for="explode-range">0%</output>
            </label>
            <input id="explode-range" type="range" min="0" max="100" value="0" />
          </div>

          <div class="panel-section compact">
            <span class="section-title">Сценарии</span>
            <div class="preset-row">
              <button type="button" data-preset="shell">Коробка</button>
              <button type="button" data-preset="engineering">Инженерия</button>
              <button type="button" data-preset="facade">Фасад</button>
            </div>
          </div>

          <div class="panel-section compact">
            <span class="section-title">Чертежи</span>
            <div class="view-row">
              <button type="button" data-view="iso">3D</button>
              <button type="button" data-view="plan">План</button>
              <button type="button" class="active" data-view="facade">Фасад</button>
              <button type="button" data-view="section">Разрез</button>
            </div>
          </div>
        </aside>

        <aside class="info-panel" aria-live="polite" aria-label="Информация о выбранной детали">
          <div class="part-kicker" id="part-layer">Проект дома</div>
          <h2 id="part-title">Общая модель</h2>
          <p id="part-copy">
            Наглядный макет показывает, как проект раскладывается на конструктивные элементы,
            пригодные для чертежей, спецификации и согласования.
          </p>
          <dl class="part-specs" id="part-specs"></dl>
        </aside>

        <div class="status-strip" aria-label="Сводка проекта">
          <span>2 этажа</span>
          <span>158 м²</span>
          <span>Гараж</span>
          <span>Терраса</span>
        </div>

        <div class="title-block" aria-label="Штамп чертежа">
          <span>Лист АР-01</span>
          <strong>Обмерная 3D-схема</strong>
          <span>М 1:100</span>
        </div>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
